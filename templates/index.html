<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Price Viewer</title><link rel="stylesheet" href="/static/style.css"></head><body><main><header><div><span class="eyebrow">КАТАЛОГ ОБЪЯВЛЕНИЙ</span><h1>Price Viewer<span>.</span></h1><p>Сравнение предложений игровых площадок</p></div><div class="badge"><i></i> Автообновление</div></header><section class="toolbar"><input id="search" placeholder="Поиск по игре или объявлению..." autocomplete="off"><div id="suggestions" class="suggestions"></div><div id="selected-category"></div><div id="category-status" class="category-status" hidden><span id="category-freshness"></span> <button id="refresh-category" type="button">Обновить категорию</button><div id="coverage"></div></div><div id="sources" class="sources" aria-label="Источники"></div><div class="filter-heading"><strong>Фильтры</strong><button id="clear-filters" type="button">Сбросить фильтры</button></div><div class="filters"><label><input id="online" type="checkbox"> Продавцы онлайн</label><input id="min-price" type="number" min="0" placeholder="Цена от"><input id="max-price" type="number" min="0" placeholder="Цена до"><select id="source"><option value="">Все площадки</option><option value="funpay">FunPay</option><option value="lolz">Lolzteam</option><option value="playerok">Playerok</option><option value="plati">Plati.Market</option></select><select id="sort"><option value="price_asc">Сначала дешевле</option><option value="source">Порядок источника</option><option value="price_desc">Сначала дороже</option></select><div id="dynamic-filters"></div></div><p class="filter-hint">Выберите категорию под строкой поиска, чтобы увидеть её специальные фильтры FunPay.</p><div id="status">Подключаемся к каталогу…</div></section><div class="heading"><h2>Объявления</h2><span id="count"></span></div><div id="items" class="items"></div><div id="empty" class="empty" hidden></div><nav><button id="prev">← Назад</button><span id="page"></span><button id="next">Далее →</button></nav><footer>Актуальную цену и наличие проверяйте на странице объявления.</footer></main><script src="/static/app.js"></script></body></html>
